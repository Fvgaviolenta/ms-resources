spring:
  application:
    name: ms-resources
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8083
  servlet:
    context-path: /

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized

catastrofescl:
  rabbitmq:
    exchange-topic: catastrofescl.events
    exchange-dlx: catastrofescl.dlx
    cola-emergencia-creada: ms-resources.emergencia-creada
    cola-emergencia-creada-dlq: ms-resources.emergencia-creada.dlq
  firebase:
    enabled: ${FIREBASE_ENABLED:true}
    project-id: ${FIREBASE_PROJECT_ID:catastrofecl-cc6bd}
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:/secrets/catastrofecl-cc6bd-firebase-adminsdk-fbsvc-d9b70d6453.json}
  auth:
    dev-mode: false
    public-paths:
      - /centros
      - /centros/cercanos
      - /centros/map-data
      - /catalogo/items
      - /actuator/health
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
